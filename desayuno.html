<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Food Service DPT — Alérgenos Desayuno</title>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
  <script src="./firebase-config.js"></script>
  <style>
    /* ── CONTROL PANEL (no imprime) ── */
    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: #f1f5f9;
      margin: 0; padding: 20px;
      color: #0f172a;
    }
    .control-panel {
      background: white; border-radius: 14px;
      padding: 20px 24px; margin-bottom: 24px;
      box-shadow: 0 4px 16px rgba(0,0,0,0.07);
      display: flex; align-items: center; gap: 20px; flex-wrap: wrap;
    }
    .ctrl-logo { height: 48px; object-fit: contain; }
    .ctrl-title { font-size: 1.1rem; font-weight: 800; color: #1e3a5f; letter-spacing: 1px; }
    .ctrl-subtitle { font-size: 0.82rem; color: #64748b; margin-top: 2px; }
    .ctrl-sep { flex: 1; }
    .ctrl-date-label { font-size: 0.82rem; font-weight: 700; color: #64748b; text-transform: uppercase; letter-spacing: 0.5px; }
    .ctrl-date-input {
      padding: 9px 14px; border: 2px solid #e2e8f0; border-radius: 9px;
      font-size: 0.9rem; color: #0f172a; outline: none;
    }
    .ctrl-date-input:focus { border-color: #3b82f6; }
    .btn-reload {
      padding: 10px 18px; background: #eff6ff; color: #1d4ed8;
      border: 2px solid #bfdbfe; border-radius: 9px;
      font-size: 0.85rem; font-weight: 700; cursor: pointer;
      transition: all 0.15s;
    }
    .btn-reload:hover { background: #dbeafe; }
    .btn-print {
      padding: 12px 26px;
      background: linear-gradient(135deg, #0b1f3a, #1d4ed8);
      color: white; border: none; border-radius: 10px;
      font-size: 0.95rem; font-weight: 700; cursor: pointer;
      letter-spacing: 0.5px; box-shadow: 0 4px 12px rgba(29,78,216,0.35);
      transition: all 0.2s;
    }
    .btn-print:hover { transform: translateY(-2px); box-shadow: 0 8px 20px rgba(29,78,216,0.4); }
    .ctrl-status {
      font-size: 0.8rem; color: #64748b;
      background: #f8fafc; border: 1px solid #e2e8f0;
      border-radius: 50px; padding: 6px 14px;
    }

    /* ── PRINT AREA (A4 LANDSCAPE) ── */
    #printArea {
      background: #f8f9fa;
      padding: 12mm 16mm;
      border-radius: 12px;
      box-shadow: 0 0 16px rgba(0,0,0,0.1);
      width: 297mm;
      height: 210mm;
      max-height: 210mm;
      box-sizing: border-box;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      position: relative;
    }

    /* ── HEADER ── */
    .print-header {
      display: flex; justify-content: space-between; align-items: center;
      border-bottom: 3px solid #1e3a5f;
      padding-bottom: 10px; margin-bottom: 12px;
      flex-shrink: 0;
    }
    .print-header-left { display: flex; align-items: center; gap: 18px; }
    .print-logo { height: 68px; object-fit: contain; }
    .print-title-block {}
    .print-title { font-size: 2rem; font-weight: 900; color: #0f172a; letter-spacing: 1px; line-height: 1; }
    .print-subtitle { font-size: 0.9rem; color: #64748b; font-style: italic; margin-top: 2px; }
    .print-date-badge {
      display: flex; align-items: center; gap: 8px;
      background: linear-gradient(135deg, #4facfe, #00f2fe);
      color: white; border-radius: 50px;
      padding: 8px 18px; font-weight: 700; font-size: 1rem;
      box-shadow: 0 4px 12px rgba(79,172,254,0.35);
      white-space: nowrap;
    }

    /* ── LAYOUT ── */
    .print-layout {
      display: flex; gap: 20px; flex: 1; min-height: 0; overflow: hidden;
    }
    .print-main {
      flex: 7.5; display: flex; flex-direction: column; gap: 8px; min-height: 0; overflow: hidden;
    }
    .print-sidebar {
      flex: 2.5; border-left: 2px solid #e2e8f0; padding-left: 16px;
      display: flex; flex-direction: column; overflow: hidden;
    }

    /* ── DISH ROWS ── */
    .print-dish-row {
      background: white; border-radius: 8px;
      border: 1px solid #e2e8f0;
      padding: 10px 18px;
      display: flex; justify-content: space-between; align-items: center;
      flex: 1; min-height: 0;
      box-shadow: 0 1px 4px rgba(0,0,0,0.04);
    }
    .print-dish-info { flex: 1; padding-right: 16px; }
    .print-dish-es {
      font-size: 1.45rem; font-weight: 900; color: #0f172a;
      text-transform: uppercase; letter-spacing: -0.3px; line-height: 1.1;
    }
    .print-dish-en { font-size: 0.92rem; font-style: italic; color: #64748b; margin-top: 2px; }
    .print-allergens { display: flex; flex-direction: column; align-items: flex-end; gap: 5px; }
    .print-alg-row { display: flex; align-items: center; gap: 5px; }
    .print-icon-wrap {
      width: 34px; height: 34px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      border: 2.5px solid rgba(255,255,255,0.9);
      box-shadow: 0 1px 4px rgba(0,0,0,0.15); overflow: hidden;
    }
    .print-icon-wrap img { width: 75%; height: 75%; object-fit: contain; }
    .print-icon-trace { border-style: dashed; opacity: 0.8; }
    .trace-tag {
      font-size: 9px; font-weight: 800; color: #92400e;
      background: #fef3c7; border: 1.5px solid #fcd34d;
      border-radius: 50px; padding: 2px 7px; letter-spacing: 0.3px;
    }
    .no-allergen-print {
      background: #ecfdf5; border: 1.5px solid #6ee7b7;
      border-radius: 6px; padding: 8px 16px; color: #065f46;
      font-weight: 800; font-size: 0.85rem;
      display: flex; flex-direction: column; align-items: center;
    }
    .no-allergen-print .en { font-style: italic; font-size: 0.78rem; opacity: 0.7; }

    /* ── SIDEBAR LEGEND (PRINT) ── */
    .print-legend-title {
      font-size: 0.75rem; font-weight: 800; color: #64748b;
      text-transform: uppercase; letter-spacing: 1.5px;
      border-bottom: 1px solid #e2e8f0; padding-bottom: 5px; margin-bottom: 8px;
    }
    .print-legend-title .en { display: block; font-style: italic; font-weight: 400; letter-spacing: 0; text-transform: none; font-size: 0.7rem; }
    .print-legend-list { display: flex; flex-direction: column; justify-content: space-between; flex: 1; }
    .print-legend-item { display: flex; align-items: center; gap: 8px; }
    .print-legend-circle {
      width: 26px; height: 26px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center; flex-shrink: 0;
    }
    .print-legend-circle img { width: 70%; height: 70%; object-fit: contain; }
    .print-legend-es { font-size: 0.72rem; font-weight: 700; color: #1e293b; text-transform: uppercase; line-height: 1.1; }
    .print-legend-en { font-size: 0.62rem; font-style: italic; color: #94a3b8; line-height: 1.1; }
    .print-traces-info { border-top: 1px dashed #e2e8f0; margin-top: 6px; padding-top: 6px; font-size: 0.65rem; color: #92400e; }

    /* ── NO DATA ── */
    .print-no-data {
      flex: 1; display: flex; align-items: center; justify-content: center;
      color: #94a3b8; font-size: 1rem; flex-direction: column; gap: 10px;
    }

    /* ── PRINT RULES ── */
    @media print {
      @page { size: A4 landscape; margin: 0; }
      html, body {
        margin: 0; padding: 0; background: white;
        -webkit-print-color-adjust: exact;
        print-color-adjust: exact;
      }
      .control-panel { display: none !important; }
      #printArea {
        width: 297mm !important; height: 210mm !important; max-height: 210mm !important;
        margin: 0 !important; border-radius: 0 !important; box-shadow: none !important;
        padding: 10mm 14mm !important; box-sizing: border-box !important;
        overflow: hidden !important;
        background: #f8f9fa !important;
      }
      .print-date-badge {
        background: linear-gradient(135deg, #4facfe, #00f2fe) !important;
        -webkit-print-color-adjust: exact; print-color-adjust: exact;
      }
      .print-dish-row { page-break-inside: avoid !important; }
    }
  </style>
</head>
<body>

<!-- CONTROL PANEL -->
<div class="control-panel">
  <img src="./img/Encabezado.png" alt="Food Service DPT" class="ctrl-logo" onerror="this.style.display='none'">
  <div>
    <div class="ctrl-title">FOOD SERVICE DPT</div>
    <div class="ctrl-subtitle">Alérgenos Desayuno · Breakfast Allergens</div>
  </div>
  <div class="ctrl-sep"></div>
  <span class="ctrl-date-label">📅 Fecha:</span>
  <input type="date" class="ctrl-date-input" id="date-override" onchange="loadData()">
  <button class="btn-reload" onclick="loadData()">🔄 Actualizar</button>
  <div class="ctrl-status" id="ctrl-status">⏳ Cargando datos...</div>
  <button class="btn-print" onclick="window.print()">🖨️ Imprimir / Guardar PDF</button>
</div>

<!-- PRINT AREA -->
<div id="printArea">
  <div class="print-header">
    <div class="print-header-left">
      <img src="./img/Encabezado.png" alt="Food Service DPT" class="print-logo" onerror="this.style.display='none'">
      <div class="print-title-block">
        <div class="print-title">DESAYUNO</div>
        <div class="print-subtitle">Breakfast Allergen Information</div>
      </div>
    </div>
    <div class="print-date-badge">
      <span>📅</span>
      <span id="display-date">Cargando fecha...</span>
    </div>
  </div>

  <div class="print-layout">
    <div class="print-main" id="print-dishes">
      <div class="print-no-data">
        <span>⏳</span><span>Conectando con Firebase...</span>
      </div>
    </div>
    <div class="print-sidebar">
      <div class="print-legend-title">
        LEYENDA DE ALÉRGENOS
        <span class="en">Allergens Legend</span>
      </div>
      <div class="print-legend-list" id="print-legend"></div>
      <div class="print-traces-info">* TRAZAS: borde punteado / dashed border = may contain traces</div>
    </div>
  </div>
</div>

<script>
// ══════════════════════════════════════════════
const ALLERGENS = [
  { id:'gluten',     es:'GLUTEN',     en:'Gluten',      color:'#e67e22', icon:'./img/alergenos_gluten.svg'     },
  { id:'crustaceos', es:'CRUSTÁCEOS', en:'Crustaceans', color:'#3498db', icon:'./img/alergenos_crustaceos.svg' },
  { id:'huevos',     es:'HUEVOS',     en:'Eggs',        color:'#f39c12', icon:'./img/alergenos_huevos.svg'     },
  { id:'pescado',    es:'PESCADO',    en:'Fish',        color:'#2c3e50', icon:'./img/alergenos_pescado.svg'    },
  { id:'cacahuetes', es:'CACAHUETES', en:'Peanuts',     color:'#d35400', icon:'./img/alergenos_cacahuetes.svg' },
  { id:'soja',       es:'SOJA',       en:'Soy',         color:'#27ae60', icon:'./img/alergenos_soja.svg'       },
  { id:'lacteos',    es:'LÁCTEOS',    en:'Dairy',       color:'#5d4037', icon:'./img/alergenos_lacteos.svg'    },
  { id:'cascara',    es:'F.CÁSCARA',  en:'Tree nuts',   color:'#c0392b', icon:'./img/alergenos_cascara.svg'    },
  { id:'apio',       es:'APIO',       en:'Celery',      color:'#8bc34a', icon:'./img/alergenos_apio.svg'       },
  { id:'mostaza',    es:'MOSTAZA',    en:'Mustard',     color:'#b8860b', icon:'./img/alergenos_mostaza.svg'    },
  { id:'sesamo',     es:'SÉSAMO',     en:'Sesame',      color:'#7f8c8d', icon:'./img/alergenos_sesamo.svg'     },
  { id:'sulfitos',   es:'SULFITOS',   en:'Sulphites',   color:'#8e44ad', icon:'./img/alergenos_sulfitos.svg'   },
  { id:'moluscos',   es:'MOLUSCOS',   en:'Molluscs',    color:'#1abc9c', icon:'./img/alergenos_moluscos.svg'   },
  { id:'altramuces', es:'ALTRAMUCES', en:'Lupins',      color:'#f1c40f', icon:'./img/alergenos_altramuces.svg' }
];

function todayStr() {
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}

function formatDateEs(dateStr) {
  if (!dateStr) return '';
  const [y, m, d] = dateStr.split('-');
  const fecha = new Date(+y, +m - 1, +d);
  let s = fecha.toLocaleDateString('es-ES', { weekday:'long', day:'numeric', month:'long', year:'numeric' });
  return s.charAt(0).toUpperCase() + s.slice(1);
}

function buildLegend() {
  const list = document.getElementById('print-legend');
  list.innerHTML = ALLERGENS.map(a => `
    <div class="print-legend-item">
      <div class="print-legend-circle" style="background:${a.color}">
        <img src="${a.icon}" alt="${a.es}" onerror="this.style.display='none'">
      </div>
      <div>
        <div class="print-legend-es">${a.es}</div>
        <div class="print-legend-en">${a.en}</div>
      </div>
    </div>
  `).join('');
}

function renderDishes(data) {
  const platos = data.platos || [];
  const container = document.getElementById('print-dishes');
  container.innerHTML = '';

  document.getElementById('display-date').textContent = formatDateEs(data.fecha);

  if (!platos.length) {
    container.innerHTML = '<div class="print-no-data"><span>🍽️</span><span>Sin datos de desayuno para este día</span></div>';
    document.getElementById('ctrl-status').textContent = '⚠️ Sin platos publicados';
    return;
  }

  document.getElementById('ctrl-status').textContent = `✅ ${platos.length} plato(s) cargados`;

  platos.forEach(p => {
    const contiene = p.contiene || [];
    const trazas   = p.trazas   || [];
    let algHtml = '';

    if (!contiene.length && !trazas.length) {
      algHtml = '<div class="no-allergen-print"><span>🛡️ SIN ALÉRGENOS DECLARADOS</span><span class="en">No allergens declared</span></div>';
    } else {
      if (contiene.length) {
        algHtml += `<div class="print-alg-row">${contiene.map(id => {
          const a = ALLERGENS.find(x=>x.id===id); if(!a) return '';
          return `<div class="print-icon-wrap" style="background:${a.color}" title="${a.es}"><img src="${a.icon}" alt="${a.es}" onerror="this.style.display='none'"></div>`;
        }).join('')}</div>`;
      }
      if (trazas.length) {
        algHtml += `<div class="print-alg-row" style="margin-top:4px;">
          <span class="trace-tag">* TRAZAS</span>
          ${trazas.map(id => {
            const a = ALLERGENS.find(x=>x.id===id); if(!a) return '';
            return `<div class="print-icon-wrap print-icon-trace" style="background:${a.color}" title="${a.es}"><img src="${a.icon}" alt="${a.es}" onerror="this.style.display='none'"></div>`;
          }).join('')}</div>`;
      }
    }

    const row = document.createElement('div');
    row.className = 'print-dish-row';
    row.innerHTML = `
      <div class="print-dish-info">
        <div class="print-dish-es">${escHtml(p.nombreEs||'PRODUCTO SIN NOMBRE')}</div>
        <div class="print-dish-en">${escHtml(p.nombreEn||'')}</div>
      </div>
      <div class="print-allergens">${algHtml}</div>
    `;
    container.appendChild(row);
  });
}

function escHtml(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function loadData() {
  if (!window._fbReady) return;
  const db = firebase.database();
  db.ref('menu/desayuno').once('value').then(snap => {
    const data = snap.val();
    if (data) renderDishes(data);
    else {
      document.getElementById('print-dishes').innerHTML = '<div class="print-no-data"><span>📭</span><span>Sin datos de desayuno publicados hoy</span></div>';
      document.getElementById('ctrl-status').textContent = '⚠️ Sin datos publicados';
      document.getElementById('display-date').textContent = formatDateEs(todayStr());
    }
  }).catch(e => {
    document.getElementById('ctrl-status').textContent = '❌ Error al cargar: ' + e.message;
  });
}

window.addEventListener('DOMContentLoaded', () => {
  const dateInput = document.getElementById('date-override');
  dateInput.value = todayStr();
  buildLegend();

  try {
    if (!firebaseConfig || firebaseConfig.apiKey === 'TU_API_KEY_AQUI') {
      document.getElementById('ctrl-status').textContent = '⚠️ Firebase no configurado — consulta README.md';
      document.getElementById('print-dishes').innerHTML = '<div class="print-no-data"><span>⚙️</span><span>Configura Firebase para cargar los datos</span></div>';
      document.getElementById('display-date').textContent = formatDateEs(todayStr());
      return;
    }
    firebase.initializeApp(firebaseConfig);
    window._fbReady = true;

    // Real-time listener for desayuno
    firebase.database().ref('menu/desayuno').on('value', snap => {
      const data = snap.val();
      if (data) renderDishes(data);
      else {
        document.getElementById('print-dishes').innerHTML = '<div class="print-no-data"><span>📭</span><span>Sin datos de desayuno publicados hoy</span></div>';
        document.getElementById('ctrl-status').textContent = '⚠️ Sin datos publicados';
        document.getElementById('display-date').textContent = formatDateEs(todayStr());
      }
    });
  } catch(e) {
    document.getElementById('ctrl-status').textContent = '❌ Error Firebase: ' + e.message;
  }
});
</script>
</body>
</html>
